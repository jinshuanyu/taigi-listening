<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>台語入門聽力練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Gentium+Book+Plus:wght@400;700&display=swap">
<style>
/* Layout: one narrow phone column. Two tabs: tone identification from real audio (4×2 陰/陽 grid) and 漢字 dictation with IME input. */
:root{
  --bg:#EEF2F1;--surface:#FFFFFF;--ink:#1D2A2C;--muted:#5E6F72;--line:#D3DCDB;
  --indigo:#27457F;--gold:#B88A22;--teal:#1F6E6A;
  --good:#24774F;--good-soft:#DDF0E5;--bad:#B23E36;--bad-soft:#F6E1DE;
  --f-han:"LXGW WenKai TC","Noto Serif TC","Kaiti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-lo:"Gentium Book Plus","Gentium Plus","Charis SIL","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141B1D;--surface:#1D2729;--ink:#E6ECEB;--muted:#97A6A8;--line:#33403F;
  --indigo:#8FA9E0;--gold:#D9B04F;--teal:#6FC2BB;--good:#6CC79A;--good-soft:#1C3A2C;--bad:#EE8A80;--bad-soft:#43231F;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141B1D;--surface:#1D2729;--ink:#E6ECEB;--muted:#97A6A8;--line:#33403F;
  --indigo:#8FA9E0;--gold:#D9B04F;--teal:#6FC2BB;--good:#6CC79A;--good-soft:#1C3A2C;--bad:#EE8A80;--bad-soft:#43231F;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-han);font-size:1.6rem;margin:0;font-weight:700;letter-spacing:.03em;text-wrap:balance}
.score{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.score b{color:var(--ink)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tabs button{font:500 1rem var(--f-body);border:0;background:transparent;color:var(--muted);padding:11px 4px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--indigo);color:var(--surface)}
.tabs button[data-mode="demo"]{color:var(--teal)}
.tabs button[data-mode="demo"][aria-selected="true"]{background:var(--teal);color:var(--surface)}
.tone.on{border-color:var(--teal);border-width:2px;background:var(--bg)}
.play.teal{background:var(--teal)}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--gold);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.hint{font-size:.9rem;color:var(--muted);margin:0}
.zh{font-size:1.25rem;font-weight:500;margin:0;text-wrap:balance}
.zh small{display:block;font-size:.78rem;color:var(--muted);font-weight:400;letter-spacing:.08em}
.play{width:84px;height:84px;border-radius:50%;border:0;background:var(--indigo);color:var(--surface);cursor:pointer;display:grid;place-items:center}
.play svg{width:34px;height:34px}
.play:active{transform:scale(.96)}
.play.busy{opacity:.6}
.grid{display:grid;grid-template-columns:auto repeat(4,1fr);gap:6px}
.rowlab{font-family:var(--f-han);color:var(--muted);display:grid;place-items:center}
.tone{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 2px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--f-body);min-height:80px}
.tone .n{font-weight:700;font-size:1.05rem;line-height:1.1}
.tone .mk{font-family:var(--f-lo);font-size:1.5rem;line-height:.8;height:16px;color:var(--indigo);font-weight:700}
.tone .mk.none{font-family:var(--f-body);font-size:.68rem;line-height:16px;color:var(--muted);font-weight:400}
.tone .k{font-family:var(--f-han);font-size:1.15rem;line-height:1}
.tone svg{width:44px;height:20px}
.tone.off{background:transparent;border-style:dashed;color:var(--muted);cursor:default;justify-content:center;font-size:.72rem;line-height:1.3}
.tone.good{background:var(--good-soft);border-color:var(--good)}
.tone.bad{background:var(--bad-soft);border-color:var(--bad)}
.tone[disabled]:not(.off){cursor:default}
.inrow{display:flex;gap:8px}
.inrow input{flex:1;min-width:0;font:400 1.6rem var(--f-han);padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-align:center}
.inrow input::placeholder{font:400 .95rem var(--f-body);color:var(--muted)}
.btn{font:700 1rem var(--f-body);border:0;border-radius:12px;padding:14px;background:var(--ink);color:var(--bg);cursor:pointer}
.btn.ghost{background:transparent;color:var(--indigo);border:1px solid var(--line);font-weight:500}
.row2{display:flex;gap:8px}.row2 .btn{flex:1}
.fb{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:.95rem}
.fb.good{background:var(--good-soft)}.fb.bad{background:var(--bad-soft)}
.fb strong{font-size:1.05rem}
.ans{font-family:var(--f-han);font-size:2rem;line-height:1.2}
.ans .ok{color:var(--good)}.ans .no{color:var(--bad);text-decoration:underline}
.lo{font-family:var(--f-lo);font-size:1.25rem}
.mine{font-size:.9rem;color:var(--muted)}
.opts{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.88rem;color:var(--muted);flex-wrap:wrap}
.opts label{display:flex;align-items:center;gap:6px;cursor:pointer}
.opts input{width:18px;height:18px;accent-color:var(--indigo)}
.demo{display:flex;flex-direction:column;gap:8px;width:100%}
.drow{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);text-align:left}
.drow:first-child{border-top:0}
.dt{display:flex;flex-direction:column;align-items:center;gap:0}
.dt .mk{font-family:var(--f-lo);font-size:1.4rem;line-height:.8;height:14px;color:var(--indigo);font-weight:700}
.dt .mk.none{font-family:var(--f-body);font-size:.65rem;line-height:14px;color:var(--muted)}
.dt .n{font-weight:700;font-size:1.3rem;line-height:1.2}
.dt svg{width:40px;height:18px}
.dinfo{display:flex;flex-direction:column;gap:6px;min-width:0}
.dname{font-size:.85rem;color:var(--muted)}
.dname b{color:var(--ink);font-family:var(--f-han);font-size:1rem}
.ex{display:flex;gap:6px;flex-wrap:wrap}
.ex button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:6px 10px;cursor:pointer;display:flex;align-items:baseline;gap:6px}
.ex button .h{font-family:var(--f-han);font-size:1.25rem}
.ex button .l{font-family:var(--f-lo);font-size:1rem;color:var(--muted)}
.ex button.on{border-color:var(--indigo);background:var(--surface)}
.dtip{font-size:.85rem;color:var(--muted);margin:0;text-align:left}
.foot a{color:var(--indigo);word-break:break-all}
.foot{font-size:.76rem;color:var(--muted);text-align:center;margin:0;text-wrap:balance}
/* ===== Site footer（與其他工具相同結構：聯絡 / 贊助 / 工具互連 / 出處 / 版權） ===== */
.site-footer{margin-top:18px;padding-top:20px;border-top:1px solid var(--line);text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.footer-icons{display:flex;align-items:center;justify-content:center;gap:18px}
.footer-icons a{color:var(--muted);display:inline-flex;text-decoration:none}
.footer-icons a:hover{color:var(--indigo)}
.footer-icons svg{width:24px;height:24px}
.coffee-btn{display:inline-block;max-width:100%;background:linear-gradient(to right,#fbbf24,#f97316);color:#fff;font-weight:500;font-size:1rem;text-align:center;padding:10px 20px;border-radius:9999px;text-decoration:none;box-shadow:0 4px 6px -1px rgba(0,0,0,.1);line-height:1.5;margin:6px 0 4px;transition:transform .2s ease}
.coffee-btn:hover{transform:scale(1.05)}
.more-tools-label{margin:6px 0 0;font-size:.95rem;color:var(--muted)}
.more-tools{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 0 6px}
.more-tools a{display:inline-block;padding:6px 14px;background:var(--surface);background:color-mix(in srgb,var(--indigo) 12%,var(--surface));color:var(--indigo);text-decoration:none;border-radius:20px;font-size:.95rem;font-weight:500}
.more-tools a:hover{background:var(--indigo);color:var(--surface)}
.copyright{color:var(--muted);font-size:.8rem;margin:0}
@media (max-width:640px){.coffee-btn{font-size:.9rem;padding:8px 16px}}
</style>
</head>

const stats={tone:{r:0,t:0,s:0},dict:{r:0,t:0,s:0}};
let q=null, done=false, last=null;

function pool(){
  const base=mode==='tone'?W.filter(w=>w.t):W;
  if($('onlyWrong').checked){const set=new Set(wrong[mode]);const p=base.filter(w=>set.has(w.n));if(p.length) return p;}
  return base;
}
function updMeta(){
  const s=stats[mode];$('score').innerHTML=`答對 <b>${s.r}</b>/${s.t} · 連續 <b>${s.s}</b>`;
  $('wrongN').textContent=wrong[mode].length;
  const d=decks[mode];$('poolN').textContent=d&&d.total?`這輪 ${d.total-d.list.length}/${d.total} 題`:`題庫 ${pool().length} 題`;
}
const decks={};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(){
  const p=pool(), key=mode+'|'+$('onlyWrong').checked+'|'+p.length;
  let d=decks[mode];
  if(!d||d.key!==key||!d.list.length){
    let list=shuffle(p);
    if(list.length>1&&list[list.length-1]===last){[list[0],list[list.length-1]]=[list[list.length-1],list[0]]}
    d=decks[mode]={key,list,total:list.length};
  }
  const w=d.list.pop(); last=w; return w;
}

function grid(){

function record(ok){
  const s=stats[mode];s.t++;if(ok){s.r++;s.s++}else s.s=0;
  const L=wrong[mode], i=L.indexOf(q.n);

}

function answerTone(t,b){
  if(done) return; done=true;
  const ok=t===q.t; record(ok);
  $('answers').querySelectorAll('[data-t]').forEach(x=>{x.disabled=true;if(+x.dataset.t===q.t)x.classList.add('good')});
  if(!ok) b.classList.add('bad');
  const T=TONES[q.t];
  $('feedback').innerHTML=`<div class="fb ${ok?'good':'bad'}" role="status"><strong>${ok?'答對了！':'差一點'}　第 ${q.t} 聲・${T.name}（${T.shape}）</strong>
    <div><span class="ans">${q.h}</span>　<span class="lo">${q.lo}</span></div><div>${q.zh}</div></div>${footer()}`;
  wire();
}

const norm=s=>s.normalize('NFC').replace(/[\s　，。、,.!！?？()（）「」]/g,'').replace(/台/g,'臺');
function checkDict(){
  if(done) return;
  const raw=$('inp').value; if(!raw.trim()){ $('inp').focus(); return; }
  done=true;
  const g=norm(raw), full=norm(q.h), short=norm(q.h.replace(/\(.*?\)/g,''));
  const target=q.h.includes('(')?(g.length>short.length?full:short):full;
  const ok=g===full||g===short;
  record(ok);
  $('inp').disabled=true;$('chk').disabled=true;
  const shown=[...target].map((c,i)=>`<span class="${[...g][i]===c?'ok':'no'}">${c}</span>`).join('');
  $('feedback').innerHTML=`<div class="fb ${ok?'good':'bad'}" role="status"><strong>${ok?'答對了！':'再看一下'}</strong>
    <div class="ans">${ok?q.h:shown}</div><div class="lo">${q.lo}</div>
    ${ok?'':`<div class="mine">你寫的：${raw}</div>`}
    ${q.h.includes('(')?'<div class="mine">括號裡的「仔」可寫可不寫。</div>':''}</div>${footer()}`;
  wire();
}

const MK={1:'',2:'´',3:'`',4:'',5:'ˆ',7:'¯',8:'ˈ'};
const TLO={1:'sai',2:'hóo',3:'pà',4:'pih',5:'kâu',7:'tshiūnn',8:'lo̍k'};
const DEMO_MP3={1:'9/9721',2:'4/4482',3:'6/6669',4:'13/13254',5:'8/8571',7:'9/9033',8:'8/8086'};
const DEMO_SRC=t=>'https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/'+DEMO_MP3[t]+'.mp3';
let seqTimer=null;
function stopSeq(){if(seqTimer){clearTimeout(seqTimer);seqTimer=null}au.onended=null;au.playbackRate=1;document.querySelectorAll('.tone.on').forEach(b=>b.classList.remove('on'))}
function playDemo(tn,rate){document.querySelectorAll('.tone.on').forEach(x=>x.classList.remove('on'));const b=$('t'+tn);if(b)b.classList.add('on');au.src=DEMO_SRC(tn);au.playbackRate=rate||1;const p=au.play();if(p)p.catch(()=>{});}
function renderDemo(){
  $('card').innerHTML=`<p class="hint">八聲口訣</p><button class="play teal" id="seq" aria-label="從第 1 聲依序播放">${playIcon}</button><p class="hint">按播放從第 1 聲連續唸；點下面的字聽單一聲調</p>`;
  $('answers').innerHTML=grid();
  $('feedback').innerHTML=`<p class="dtip">有 -p / -t / -k / -h 結尾的字只會是第 4 或第 8 聲：4 聲不標符號、8 聲標一豎。第 6 聲已併入第 7 聲。</p>`;
  $('answers').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{stopSeq();playDemo(+b.dataset.t,1)});
  $('seq').onclick=()=>{stopSeq();const list=[1,2,3,4,5,7,8];let i=0;
    const step=()=>{if(i>=list.length){stopSeq();return}playDemo(list[i++],1.35);au.onended=()=>{seqTimer=setTimeout(step,120)}};step();};
}
function setMode(m){stopSeq();mode=m;store.set('ty-mode',m);document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.mode===m));const demo=m==='demo';$('opts').hidden=demo;$('score').hidden=demo;if(demo){renderDemo();return}newQ(false);}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
$('onlyWrong').onchange=()=>newQ(false);
setMode(mode);
</script>
